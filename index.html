<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" id="theme-meta" content="#6366f1"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Kalorie"/>
<meta name="application-name" content="Kalorie"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<title>Kalorie</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;font-family:system-ui,-apple-system,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button:active{opacity:.82}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
textarea{resize:none}
input[type=number]::-webkit-inner-spin-button{opacity:1}

:root{
  --bg:#f1f5f9;--card:#fff;--surface:#f1f5f9;--border:#e2e8f0;
  --text:#1e293b;--muted:#6b7280;--track:#e2e8f0;
  --accent:#6366f1;--accent2:#8b5cf6;
  --sheet-radius:20px 20px 0 0;
  --fab-bottom:24px;
  --top-safe:env(safe-area-inset-top,0px);
  --bot-safe:env(safe-area-inset-bottom,0px);
  --fs-xs:10px;--fs-sm:12px;--fs-base:14px;--fs-md:15px;--fs-lg:16px;--fs-xl:18px;--fs-xxl:24px;
}
/* ── SKINY ── */
/* Indigo (default) */
.skin-indigo{--accent:#6366f1;--accent2:#8b5cf6}
.skin-indigo.dark{--bg:#0a0f1e;--card:#0f172a;--surface:#1e293b;--border:#1e293b;--text:#f1f5f9;--muted:#64748b;--track:#1e293b}
/* Forest */
.skin-forest{--bg:#f0fdf4;--card:#fff;--surface:#f0fdf4;--border:#bbf7d0;--text:#14532d;--muted:#6b7280;--track:#bbf7d0;--accent:#16a34a;--accent2:#15803d}
.skin-forest.dark{--bg:#052e16;--card:#14532d;--surface:#166534;--border:#166534;--text:#f0fdf4;--muted:#86efac;--track:#166534}
/* Sunset */
.skin-sunset{--bg:#fff7ed;--card:#fff;--surface:#fff7ed;--border:#fed7aa;--text:#7c2d12;--muted:#9a3412;--track:#fed7aa;--accent:#f97316;--accent2:#ef4444}
.skin-sunset.dark{--bg:#1c0a00;--card:#431407;--surface:#7c2d12;--border:#7c2d12;--text:#fff7ed;--muted:#fdba74;--track:#7c2d12}
/* Ocean */
.skin-ocean{--bg:#f0f9ff;--card:#fff;--surface:#f0f9ff;--border:#bae6fd;--text:#0c4a6e;--muted:#0369a1;--track:#bae6fd;--accent:#0ea5e9;--accent2:#0284c7}
.skin-ocean.dark{--bg:#0a1628;--card:#0c2340;--surface:#0f3460;--border:#0f3460;--text:#f0f9ff;--muted:#7dd3fc;--track:#0f3460}
/* Midnight */
.skin-midnight{--bg:#0d0d0d;--card:#1a1a2e;--surface:#16213e;--border:#0f3460;--text:#e2e8f0;--muted:#64748b;--track:#0f3460;--accent:#e94560;--accent2:#a855f7}
.skin-midnight.dark{--bg:#0d0d0d;--card:#1a1a2e;--surface:#16213e;--border:#0f3460;--text:#e2e8f0;--muted:#64748b;--track:#0f3460}
/* Rose */
.skin-rose{--bg:#fff1f2;--card:#fff;--surface:#fff1f2;--border:#fecdd3;--text:#881337;--muted:#be123c;--track:#fecdd3;--accent:#f43f5e;--accent2:#e11d48}
.skin-rose.dark{--bg:#1a0010;--card:#4c0519;--surface:#881337;--border:#881337;--text:#fff1f2;--muted:#fda4af;--track:#881337}
/* Amber */
.skin-amber{--bg:#fffbeb;--card:#fff;--surface:#fffbeb;--border:#fde68a;--text:#78350f;--muted:#92400e;--track:#fde68a;--accent:#f59e0b;--accent2:#d97706}
.skin-amber.dark{--bg:#1c1000;--card:#451a03;--surface:#78350f;--border:#78350f;--text:#fffbeb;--muted:#fcd34d;--track:#78350f}
/* Teal */
.skin-teal{--bg:#f0fdfa;--card:#fff;--surface:#f0fdfa;--border:#99f6e4;--text:#134e4a;--muted:#0f766e;--track:#99f6e4;--accent:#14b8a6;--accent2:#0d9488}
.skin-teal.dark{--bg:#001a18;--card:#134e4a;--surface:#0f766e;--border:#0f766e;--text:#f0fdfa;--muted:#5eead4;--track:#0f766e}
/* Slate */
.skin-slate{--bg:#f8fafc;--card:#fff;--surface:#f1f5f9;--border:#cbd5e1;--text:#0f172a;--muted:#475569;--track:#cbd5e1;--accent:#475569;--accent2:#334155}
.skin-slate.dark{--bg:#020617;--card:#0f172a;--surface:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--track:#334155}

@media all and (display-mode: standalone){
  body{ padding-top:var(--top-safe); }
  .sticky-header{ top:var(--top-safe) !important; }
}
.dark{--bg:#0a0f1e;--card:#0f172a;--surface:#1e293b;--border:#1e293b;--text:#f1f5f9;--muted:#64748b;--track:#1e293b}

body{background:var(--bg);color:var(--text);transition:background .3s,color .3s}

.tab-btn{padding:13px 15px;border:none;background:transparent;font-size:var(--fs-sm);font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

.card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.inp{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:var(--fs-base);padding:11px 13px;outline:none;width:100%;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted)}
.btn-pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;color:#fff;font-size:var(--fs-base);font-weight:700;cursor:pointer;padding:13px;width:100%;transition:opacity .2s}
.btn-pri:disabled{opacity:.4;cursor:not-allowed}
.prog-bar{background:var(--track);border-radius:99px;height:7px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .5s ease}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:640px;
  background:var(--card);
  border-radius:var(--sheet-radius);
  border:1px solid var(--border);
  padding:20px 20px max(20px, calc(env(safe-area-inset-bottom) + 20px));
  height:90dvh;
  max-height:90dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.sheet-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-right:2px}
.sheet-footer{flex-shrink:0;padding-top:12px;border-top:1px solid var(--border);margin-top:8px}

.entry{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:8px;animation:slideUp .22s ease}

.slot-btn{padding:5px 11px;border-radius:99px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .2s}
.slot-btn.active{border-color:var(--accent);color:var(--accent);font-weight:700}

/* ── STYLY PRO MINIMALISTICKÝ GRID (KONCEPT 2) ── */
.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.grid-item {
  border: none;
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  aspect-ratio: 1.1;
}
.grid-item:active {
  transform: scale(0.96);
}
.grid-item .icon {
  font-size: 28px;
  margin-bottom: 8px;
}
.grid-item .title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 4px;
}
.grid-item .desc {
  font-size: 11px;
  opacity: 0.7;
  line-height: 1.3;
}

/* Dynamické barvy adaptivní na světlý i tmavý režim */
.grid-ai { background: rgba(168, 85, 247, 0.08); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.2); }
.grid-ean { background: rgba(14, 165, 233, 0.08); color: #0ea5e9; border: 1px solid rgba(14, 165, 233, 0.2); }
.grid-manual { background: rgba(22, 163, 74, 0.08); color: #16a34a; border: 1px solid rgba(22, 163, 74, 0.2); }
.grid-saved { background: rgba(244, 63, 94, 0.08); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.2); }

/* V tmavém režimu zjemníme barvy písma */
.dark .grid-ai { color: #c084fc; }
.dark .grid-ean { color: #38bdf8; }
.dark .grid-manual { color: #4ade80; }
.dark .grid-saved { color: #fb7185; }

/* Skrytí původního lištového menu, pokud chceme čistý grid */
.hidden-tabs { display: none !important; }

.mode-tab{flex:1;padding:8px 4px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-weight:500;cursor:pointer;font-size:12px;transition:all .2s;white-space:nowrap}
.mode-tab.active{background:var(--accent);color:#fff;font-weight:700}
.tempo-btn{flex:1;padding:9px 4px;border:2px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);font-weight:600;cursor:pointer;font-size:11px;text-align:center;line-height:1.5;transition:all .2s}
.tempo-btn.active{border-color:#f59e0b;background:rgba(245,158,11,.08);color:#92400e}
.dark .tempo-btn.active{color:#fbbf24}
.gender-btn{flex:1;padding:10px;border:2px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);font-weight:600;cursor:pointer;font-size:14px;transition:all .2s}
.gender-btn.active{border-color:var(--accent);color:var(--accent)}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes scanline{0%{transform:translateY(-50px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(50px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .7s linear infinite}

.fab{position:fixed;bottom:var(--fab-bottom);right:20px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:28px;line-height:1;border:none;box-shadow:0 6px 20px rgba(99,102,241,.5);z-index:200;cursor:pointer;display:flex;align-items:center;justify-content:center}

@media (orientation:landscape) and (max-height:500px){
  .sheet{height:100dvh;max-height:100dvh;border-radius:0;padding:12px 16px}
  .sticky-header .tab-btn{padding:8px 12px;font-size:12px}
}
/* Tablet landscape */
@media (orientation:landscape) and (min-width:600px){
  .sticky-header{display:flex;flex-wrap:nowrap}
  #app > div > div:first-child{position:sticky;top:0;z-index:100}
}

@media (min-width:768px){
  :root{--sheet-radius:16px;--fab-bottom:32px}
  .modal-overlay{align-items:center}
  .sheet{height:auto;max-height:85vh;border-radius:16px;max-width:560px}
  .tab-btn{font-size:14px;padding:14px 18px}
  .mode-tab{font-size:13px}
}
@media (min-width:1024px){
  :root{--fab-bottom:40px}
  .sheet{max-width:600px;max-height:80vh}
  .modal-overlay{align-items:center}
  body{font-size:15px}
  .inp{font-size:15px}
  .tab-btn{font-size:15px;padding:15px 20px}
}
@media (max-height:600px) and (max-width:768px){
  .sheet{height:100dvh;max-height:100dvh;border-radius:0}
  :root{--sheet-radius:0}
}

.fab{padding-bottom:0;bottom:max(var(--fab-bottom),calc(env(safe-area-inset-bottom) + 16px));right:max(20px,calc(env(safe-area-inset-right) + 16px))}
input:focus,textarea:focus{scroll-margin-bottom:120px}
.macro-detail-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px}
.macro-detail-card{background:var(--card);border-radius:24px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;padding:20px;border:1px solid var(--border)}

.sync-toast{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,#16a34a,#15803d);
  color:white;
  padding:12px 24px;
  border-radius:50px;
  font-weight:600;
  font-size:14px;
  z-index:10000;
  box-shadow:0 4px 20px rgba(22,163,74,0.4);
  opacity:0;
  transition:all 0.3s ease;
  pointer-events:none;
  max-width:90vw;
  white-space:normal;
  text-align:center;
}
.sync-toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
.sync-toast.error{
  background:linear-gradient(135deg,#dc2626,#b91c1c);
  box-shadow:0 4px 20px rgba(220,38,38,0.4);
}
.sync-toast.warning{
  background:linear-gradient(135deg,#f59e0b,#d97706);
  box-shadow:0 4px 20px rgba(245,158,11,0.4);
}
</style>
</head>
<body>
<div id="splash" style="position:fixed;inset:0;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s">
  <div style="font-size:72px;margin-bottom:16px">🍽</div>
  <div style="color:#fff;font-size:24px;font-weight:800;letter-spacing:1px">Kalorie AI</div>
  <div style="color:rgba(255,255,255,.7);font-size:14px;margin-top:8px">Načítám databázi…</div>
  <div style="color:rgba(255,255,255,.5);font-size:11px;margin-top:4px" id="splash-status">připravuji…</div>
</div>
<div id="app"></div>

<div id="sync-toast" class="sync-toast"></div>

<div id="macro-detail-modal" style="display:none" class="macro-detail-modal" onclick="closeMacroDetail()">
  <div class="macro-detail-card" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span id="macro-detail-title" style="font-size:18px;font-weight:800"></span>
      <button onclick="closeMacroDetail()" style="background:var(--surface);border:none;border-radius:8px;padding:4px 12px;font-size:18px;cursor:pointer;color:var(--muted)">×</button>
    </div>
    <div id="macro-detail-list" style="max-height:55vh;overflow-y:auto"></div>
    <div id="macro-detail-total" style="margin-top:14px;padding-top:12px;border-top:2px solid var(--border);font-weight:700;text-align:right;font-size:15px"></div>
  </div>
</div>

<div id="scanner" style="display:none;position:fixed;inset:0;z-index:500;background:#000;flex-direction:column">
  <div style="position:relative;flex:1;overflow:hidden">
    <video id="scan-vid" muted playsinline style="width:100%;height:100%;object-fit:cover"></video>
    <canvas id="scan-canvas" style="display:none"></canvas>
    <div style="position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;pointer-events:none">
      <div style="position:relative;width:280px;height:150px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);border-radius:12px">
        <div style="position:absolute;top:0;left:0;width:28px;height:28px;border-top:3px solid #6366f1;border-left:3px solid #6366f1;border-radius:8px 0 0 0"></div>
        <div style="position:absolute;top:0;right:0;width:28px;height:28px;border-top:3px solid #6366f1;border-right:3px solid #6366f1;border-radius:0 8px 0 0"></div>
        <div style="position:absolute;bottom:0;left:0;width:28px;height:28px;border-bottom:3px solid #6366f1;border-left:3px solid #6366f1;border-radius:0 0 0 8px"></div>
        <div style="position:absolute;bottom:0;right:0;width:28px;height:28px;border-bottom:3px solid #6366f1;border-right:3px solid #6366f1;border-radius:0 0 8px 0"></div>
        <div style="position:absolute;left:4px;right:4px;top:50%;height:2px;background:linear-gradient(90deg,transparent,#6366f1,#8b5cf6,transparent);animation:scanline 1.8s ease-in-out infinite"></div>
      </div>
    </div>
    <div id="scan-status" style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:28px 20px 16px;text-align:center;font-size:14px;font-weight:600;color:#fff">Načítám kameru…</div>
  </div>
  <div style="background:#0a0f1e;padding:12px 20px 28px;display:flex;flex-direction:column;gap:10px">
    <button id="scan-fallback-btn" onclick="document.getElementById('scan-file-inp').click()" style="width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:none">📸 Vyfotit čárový kód</button>
    <input type="file" id="scan-file-inp" accept="image/*" capture="environment" style="display:none" onchange="handleScanFile(this)"/>
    <button onclick="closeScanner()" style="width:100%;padding:14px;background:#1e293b;border:1px solid #334155;border-radius:14px;color:#94a3b8;font-size:15px;cursor:pointer">✕ Zavřít</button>
  </div>
</div>

<div id="modal" style="display:none" class="modal-overlay" onclick="closeModal()">
  <div class="sheet" onclick="event.stopPropagation()" style="text-align:center">
    <div id="modal-msg" style="color:var(--text);margin-bottom:20px;font-size:15px;line-height:1.5"></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button onclick="modalYes()" style="background:#ef4444;color:#fff;border:none;border-radius:10px;padding:10px 22px;font-weight:700;cursor:pointer;font-size:14px">Smazat</button>
      <button onclick="closeModal()" style="background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:10px 22px;font-weight:600;cursor:pointer;font-size:14px">Zrušit</button>
    </div>
  </div>
</div>

<div id="add-sheet" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeAdd()">
  <div class="sheet" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0">
      <div style="font-size:16px;font-weight:700;color:var(--text)">Přidat jídlo</div>
      <button onclick="closeAdd()" style="background:var(--surface);border:none;border-radius:8px;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 10px">×</button>
    </div>
    <div id="slot-row" style="display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;flex-shrink:0"></div>
    
    <!-- ── NOVÝ MINIMALISTICKÝ GRID (Zobrazuje se jako rozcestník) ── -->
    <div class="menu-grid" id="grid-navigation">
      <button class="grid-item grid-ai" onclick="setMode('ai')">
        <span class="icon">🤖</span>
        <span class="title">AI Odhad</span>
        <span class="desc">Magický robot odhadne jídlo z textu nebo fotky</span>
      </button>
      <button class="grid-item grid-ext grid-ean" onclick="setMode('ean')">
        <span class="icon">📷</span>
        <span class="title">Skenovat EAN</span>
        <span class="desc">Naskenuj čárový kód z obalu potraviny</span>
      </button>
      <button class="grid-item grid-manual" onclick="setMode('manual')">
        <span class="icon">📝</span>
        <span class="title">Ručně</span>
        <span class="desc">Přesné zadání kalorií a gramáže</span>
      </button>
      <button class="grid-item grid-saved" onclick="setMode('saved')">
        <span class="icon">⭐</span>
        <span class="title">Moje Jídla</span>
        <span class="desc">Tvoje uložené recepty a oblíbená jídla</span>
      </button>
    </div>

    <!-- Původní lištové záložky schováme pomocí CSS třídy 'hidden-tabs' -->
    <div style="display:flex;gap:0;margin-bottom:12px;background:var(--surface);border-radius:10px;padding:3px;flex-shrink:0" class="hidden-tabs">
      <button class="mode-tab active" id="tab-manual" onclick="setMode('manual')">✏️ Ručně</button>
      <button class="mode-tab" id="tab-ai" onclick="setMode('ai')">🤖 AI</button>
      <button class="mode-tab" id="tab-ean" onclick="setMode('ean')">📷 Sken</button>
      <button class="mode-tab" id="tab-saved" onclick="setMode('saved')">⭐ Moje</button>
    </div>
    
    <div class="sheet-body">

    <!-- Zadní tlačítko "Zpět do menu", které se objeví pouze uvnitř otevřeného panelu -->
    <button id="grid-back-btn" onclick="resetToGridMenu()" style="display:none;width:100%;padding:8px;background:var(--surface);border:1px dashed var(--border);border-radius:10px;color:var(--muted);font-weight:600;margin-bottom:12px;cursor:pointer">← Zpět na výběr metody</button>

    <div id="panel-ai" style="display:none">

        <div><label style="font-size:10px;font-weight:700;color:#8b5cf6;display:block;margin-bottom:4px">VLÁKN.</label><input class="inp" type="number" id="m-vl" placeholder="0g"/></div>
